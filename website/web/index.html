<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Brian UI의 기반 값, 테마, 실제 Flutter 컴포넌트와 사용 가이드.">
  <meta name="theme-color" content="#ffffff">
  <title>Brian UI · 문서</title>
  <style>
    body { margin: 0; background: #fff; color: #292929; font-family: sans-serif; }
    #loading { min-height: 100vh; display: grid; place-content: center; gap: 12px; text-align: center; }
    #loading strong { font-size: 24px; }
    #loading p { color: #666; }
  </style>
</head>
<body>
  <div id="loading" role="status"><strong>Brian UI</strong><p>컴포넌트와 가이드를 불러오고 있습니다.</p></div>
  <noscript>이 문서 사이트에는 JavaScript가 필요합니다. <a href="api/index.html">API 참조 보기</a></noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
